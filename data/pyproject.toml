[project]
name = "augur-data"
version = "0.1.0"
description = "Augur : ingestion, nettoyage et indices de prix PoE 2"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "polars>=1.30",
]

[project.optional-dependencies]
pipelines = ["dagster>=1.10"]
dev = ["pytest>=8", "jsonschema>=4.23", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augur_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["augur_data", "conftest"]
