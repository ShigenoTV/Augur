# Mise à jour des données de jeu (RePoE, arbre PoB, Forge), lancée à la main.
#
# Lance `tools/gamedata/mise_a_jour.py`, affiche le rapport des différences dans le résumé du run
# et le dépose en artefact avec les fichiers régénérés. Lecture seule : ce workflow ne pousse rien
# et n'ouvre aucune PR ; les fichiers de l'artefact se versent ensuite par une PR normale.
name: Mise à jour des données

on:
  workflow_dispatch:
    inputs:
      arbre:
        description: "Version d'arbre PoB (ex. 1_0) ; auto = la dernière annoncée par PoB"
        default: auto
      coe:
        description: "Rafraîchir aussi les poids et Essences Craft of Exile"
        type: boolean
        default: false
      poe1:
        description: "Mettre aussi à jour les données PoE 1 (Forge PoE 1, stats de trade)"
        type: boolean
        default: false
      pob_poe1:
        description: "Version de Path of Building PoE 1 à embarquer (tag ou commit) ; vide = inchangée"
        default: ""

permissions:
  contents: read

jobs:
  mise-a-jour:
    name: Régénérer et comparer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Mise à jour des données
        env:
          ARBRE: ${{ inputs.arbre }}
          COE: ${{ inputs.coe && '--coe' || '' }}
        run: |
          python tools/gamedata/mise_a_jour.py --arbre "$ARBRE" $COE --rapport rapport.md
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Contrôle des monnaies de Forge (poe.ninja)
        # Signale les monnaies sans cote et les nouveaux objets inconnus de Forge, sans bloquer le run.
        continue-on-error: true
        run: |
          python tools/gamedata/controle_monnaies.py --rapport rapport-monnaies.md || test $? -eq 1
          cat rapport-monnaies.md >> "$GITHUB_STEP_SUMMARY"
      - name: Mise à jour des données PoE 1
        if: inputs.poe1
        env:
          POB: ${{ inputs.pob_poe1 }}
        run: |
          python tools/gamedata/mise_a_jour_poe1.py ${POB:+--pob "$POB"} --rapport rapport-poe1.md
          cat rapport-poe1.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: mise-a-jour-donnees
          path: |
            rapport.md
            rapport-monnaies.md
            rapport-poe1.md
            crates/poe2-core/data/forge-poe1.json.gz
            crates/poe2-core/data/trade-stats-poe1.json
            crates/pob-poe1/paquet/pob-poe1.tar.gz
            crates/pob-poe1/paquet/VERSION
            crates/poe2-core/data/gemmes.json
            crates/poe2-core/data/arbre.json
            crates/poe2-core/data/forge.json.gz
            crates/poe2-core/data/trade-stats.json
            tools/theorycraft/donnees/poids-coe.json
            tools/theorycraft/donnees/essences-coe.json
