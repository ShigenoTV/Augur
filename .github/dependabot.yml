# Mises à jour automatiques des dépendances et correctifs de sécurité.
# L’écosystème « npm » de Dependabot couvre aussi les projets pnpm (pnpm-lock.yaml).
# Les alertes et les « security updates » Dependabot doivent aussi être
# activés dans Settings > Code security du dépôt.
version: 2
updates:
  - package-ecosystem: "cargo"
    directories: ["/", "/**/*"]
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "securite"]
    groups:
      rust-mineures:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories: ["/", "/**/*"]
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "securite"]
    groups:
      npm-mineures:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories: ["/", "/**/*"]
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "securite"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/Paris" }
    labels: ["dependencies", "securite"]
