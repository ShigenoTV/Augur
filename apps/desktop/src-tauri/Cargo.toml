[package]
name = "augur-desktop"
version = "0.1.5"
description = "Application Windows Augur : overlay en jeu (Upgrade Copilot) et planificateur"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "augur_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
augur-contracts = { path = "../../../crates/augur-contracts" }
poe2-core = { path = "../../../crates/poe2-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false }
log = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
# Relevé poe.ninja (Forge). Même version que celle de tauri-plugin-updater : ses
# fonctionnalités (TLS rustls, sans fournisseur de chiffrement) s'appliquent aussi ici.
reqwest = { version = "0.13", default-features = false }
# Fournisseur de chiffrement de rustls, comme tauri-plugin-updater (reqwest « rustls-no-provider »).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
