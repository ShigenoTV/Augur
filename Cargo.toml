# Workspace Cargo d'Augur : crates/* (moteur, contrats, rate limits) et
# l'application Tauri (apps/desktop/src-tauri), avec un Cargo.lock unique.
[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# Binaire de l'application Windows : petit et optimisé.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
