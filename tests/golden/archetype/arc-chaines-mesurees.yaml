# Nombre de chaînes d'Arc de Max (client 0.5.5e, 1er novembre 2026).
# chaînes = chaînes de base du niveau (RePoE) + plancher(qualité × 0,1), ×2 avec Dominus' Grasp.
# Sortie du moteur : nombre_chaines (chaines_base, qualite, chaines_par_qualite, number_of_chains).
- id: arc-chaines-niveau-22-001
  patch: "0.5.5e"
  confiance: mesuré
  description: "Arc niveau 22, qualité 31 % : 9 chaînes de base + 3 = 12 affichées au tooltip."
  personnage:
    competence:
      nom: Arc (niveau 22)
      type: sort
      temps_incantation: 1.1
      critique_base: 9
      degats: { foudre: [26, 499] }
      chaines_base: 9
      qualite: 31
      chaines_par_qualite: 0.1
  attendu:
    nombre_chaines: 12
  preuve: "Tooltip d'Arc envoyé par Max le 1er novembre 2026 : Chains 12 times"

