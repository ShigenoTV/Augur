- id: arc-chaines-dominus-003
  patch: "0.5.5e"
  confiance: mesuré
  description: >
    Avec Dominus' Grasp (100 % de chaînes en plus), 14 chaînes deviennent 28 dans le panneau
    d'information. Le panneau n'ajoute pas les 6 chaînes de l'infusion (I-17) : mode
    d'infusion « panneau » par défaut.
  personnage:
    competence:
      nom: Arc (niveau 32, Dominus' Grasp)
      type: sort
      temps_incantation: 1.1
      critique_base: 9
      degats: { foudre: [94, 1791] }
      chaines_base: 11
      qualite: 36
      chaines_par_qualite: 0.1
      infusion: { element: foudre, degats_more: 200, chaines: 6 }
    modificateurs:
      - { stat: number_of_chains, type: more, valeur: 100, source: "Support : Dominus' Grasp" }
  attendu:
    nombre_chaines: 28
  preuve: "Panneau d'information d'Arc envoyé par Max le 1er novembre 2026 : Chain count 28"
