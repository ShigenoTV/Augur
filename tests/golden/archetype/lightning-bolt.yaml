# Archétype du Sprint 1 : Lightning Bolt (gemme LightningBoltPlayer).
# Données de la gemme : RePoE, export du patch 0.5.5.5 (skills.json) :
#   temps d'incantation 850 ms, chance de critique de base 1000 (= 10 %),
#   dégâts de foudre par niveau (niveau 20 : 30 à 565 ; niveau 21 : 34 à 642).
# Formules : fiches docs/theorycraft/fiches/ (confiance « supposé »).
# Ces cas seront recoupés par la mesure 4 de Max (tooltip en jeu) ; ils passeront
# alors à « mesuré » avec la capture en preuve.
- id: lightning-bolt-nominal-001
  patch: "0.5.5.5"
  confiance: supposé
  description: >
    Lightning Bolt niveau 20 sans aucun modificateur, cible sans résistance.
    Coup moyen = (30 + 565) / 2.
  personnage:
    competence:
      nom: Lightning Bolt (niveau 20)
      type: sort
      temps_incantation: 0.85
      critique_base: 10
      degats: { foudre: [30, 565] }
  conditions:
    cible: { description: "cible sans résistance" }
  attendu:
    tolerance_pct: 0.01
    coup_moyen: 297.5
    chance_critique: { valeur: 10, tolerance_abs: 0 }
    incantations_par_seconde: 1.176471
    dps: 385                  # 297,5 × 1,10 × 1/0,85
  preuve: "RePoE 0.5.5.5 (données de gemme) ; formules supposées"

