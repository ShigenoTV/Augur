    Personnage d'endgame type : +60 % dégâts de foudre, +40 % dégâts de sort,
    +20 % dégâts élémentaires (additifs : +120 %), +100 % chance de critique,
    +30 % vitesse d'incantation, cible à 30 % de résistance à la foudre.
  personnage:
    competence:
      nom: Lightning Bolt (niveau 20)
      type: sort
      temps_incantation: 0.85
      critique_base: 10
      degats: { foudre: [30, 565] }
    modificateurs:
      - { stat: lightning_damage, type: increased, valeur: 60, source: "Objet : baguette" }
      - { stat: spell_damage, type: increased, valeur: 40, source: "Objet : amulette" }
      - { stat: elemental_damage, type: increased, valeur: 20, source: "Passif" }
      - { stat: critical_hit_chance, type: increased, valeur: 100, source: "Objet : casque" }
      - { stat: cast_speed, type: increased, valeur: 30, source: "Objet : anneau" }
