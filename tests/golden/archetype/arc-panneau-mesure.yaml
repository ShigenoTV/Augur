# Les cas suivants rejouent les mêmes panneaux à partir des supports d'Arc, au lieu de
# reprendre les chiffres combinés : Zenith II (modificateur conditionnel au mana) et
# la cadence via Spell Totem.

- id: arc-zenith-mana-plein-004
  patch: "0.5.5e"
  confiance: mesuré
  description: >
    Dégâts du panneau sans Zenith II, plus Zenith II (30 % de dégâts en plus au-dessus de
    90 % de mana) avec le mana plein : on retombe sur le panneau complet (coup moyen
    77510,26, DPS 120140,9). 24231,5 × 1,30 = 31500,95 contre 31501 affiché.
  personnage:
    competence:
      nom: Arc (niveau 32, panneau sans Zenith II)
      type: sort
      temps_incantation: 0.6451613   # 1 / 1,55
      critique_base: 31.41
      degats:
        foudre: [1881, 39416]
        feu: [129, 2467]
        froid: [228, 4342]
    modificateurs:
      - { stat: critical_damage_bonus, type: increased, valeur: 365, source: "Bonus de +465 % affiché" }
      - { stat: spell_damage, type: more, valeur: 30, source: "Support : Zenith II", condition: { mana_min_pct: 90 } }
  conditions:
    mana_pct: 100
  attendu:
    tolerance_pct: 0.01
    coup_moyen: 31501
    dps: 120140.9
  preuve: "Captures de Max du 1er et du 5 novembre 2026 (panneau avec et sans Zenith II)"

